apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-web-deployment
  labels:
    app: ubuntu-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ubuntu-web
  template:
    metadata:
      labels:
        app: ubuntu-web
    spec:
      containers:
        - name: ubuntu-web-container
          image: sriramyaganni/ubuntu-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-web-service
spec:
  type: NodePort
  selector:
    app: ubuntu-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80  
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-web-cluster
spec:
  type: ClusterIP
  selector:
    app: ubuntu-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-web-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: ubuntu-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
